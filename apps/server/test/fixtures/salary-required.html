<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Backend Engineer — Fixture Co (salary gate)</title></head>
<body>
<h1>Apply for Backend Engineer</h1>
<form id="application_form">
  <div class="field">
    <label for="first_name">First Name *</label>
    <input id="first_name" name="first_name" type="text" required>
  </div>
  <div class="field">
    <label for="last_name">Last Name *</label>
    <input id="last_name" name="last_name" type="text" required>
  </div>
  <div class="field">
    <label for="email">Email *</label>
    <input id="email" name="email" type="email" required>
  </div>
  <div class="field">
    <label for="salary">What are your salary expectations? *</label>
    <input id="salary" name="salary_expectation" type="text" required>
  </div>
  <button type="submit">Submit Application</button>
</form>
</body>
</html>
